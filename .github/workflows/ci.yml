name: Test ve derleme
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm run release:zip
      - uses: actions/upload-artifact@v4
        with:
          name: KlavyeTrain-deneme-paketi
          path: release/*
